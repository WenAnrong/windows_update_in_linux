# Auto-publish a GitHub Release with the prebuilt single-file binary.
#
# Trigger: push a tag matching "v*" (e.g. v1.0.0), or run manually.
#   git tag v1.0.0 && git push origin v1.0.0
#
# The workflow builds on ubuntu-24.04 and uploads the resulting
# ./windows_update_in_linux binary as a Release asset. No PAT needed —
# it uses the built-in GITHUB_TOKEN.
name: release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake pkg-config \
                    libdrm-dev libfreetype-dev libfontconfig1-dev

            - name: Build
              run: |
                  cmake -B build -DCMAKE_BUILD_TYPE=Release
                  cmake --build build -j
                  mkdir -p dist
                  cp windows_update_in_linux dist/

            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/windows_update_in_linux
                  generate_release_notes: true
